# Managed file. Edit it in sirloinbh/project-standards templates/app/frontend/
# API request limit per client IP (#291): 10 requests a second on average, bursts of 40 pass at
# once, more get 429. An app may add its own limit in the API; this one applies in front of it.
# This file is included inside the http block (/etc/nginx/conf.d/default.conf), where the zone
# must be.
limit_req_zone $binary_remote_addr zone=api:1m rate=10r/s;
# Request ID for the API log (#552, docs/logging.md): keep the caller's X-Request-Id, else nginx's own
# random $request_id. The API checks the format and returns it in the X-Request-Id response header.
map $http_x_request_id $api_request_id {
  default $http_x_request_id;
  "" $request_id;
}

server {
  listen 80 default_server;
  # On the server, the shared proxy forwards https://money-ledger.daysofme.com here (ADR-0012, #254).
  # default_server still answers 127.0.0.1:8105 for local runs and health checks.
  server_name money-ledger.daysofme.com;
  # The proxy reaches this container through Docker's host gateway and appends the client address
  # to X-Forwarded-For, so the API limit above counts each client, not the proxy (#254).
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;
  root /usr/share/nginx/html;
  location /api/ {
    # Request body limit for uploads (#589): registry service.apiBodyMb, default 1m (the nginx default).
    client_max_body_size 1m;
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://api:3105;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $api_request_id;
  }
  # Caching for the installable app (docs/pwa.md): hashed build files never change; the service worker,
  # manifest and pages are revalidated on every load. A location with its own add_header drops the
  # server-level ones, so those locations repeat the two security headers.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }
  location ~ ^/(sw\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
}
