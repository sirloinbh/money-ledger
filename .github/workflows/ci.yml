# Managed file. Edit it in sirloinbh/project-standards templates/app/.github/workflows/
# Calls the central shared CI (reusable-app-ci) pinned to the central commit that was synced. Values come from the central registry and versions.json.
name: ci

# One run per commit: a pull request is tested through pull_request only; push runs on main (#699).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # write is the most the image-push job of the reusable workflow may use; every other job gets read (ADR-0023, #754).
  packages: write

# A new push to a pull request branch cancels that branch's older run. A run on main is never cancelled:
# autodeploy treats a cancelled run of a commit as a failure, so main runs get a group of their own (#873).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: sirloinbh/project-standards/.github/workflows/reusable-app-ci.yml@9594400325f502e9bd144a0f9831bf7390cee544
    with:
      node-version: '24.21.0'
      npm-version: '11.19.0'
      postgres-image: 'postgres:17-alpine'
      db-name: 'money_test'
      e2e: true
      e2e-visual: false
      playwright-image: 'mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27'
      knip-strict: true
      push-images: true
      image-prefix: 'ghcr.io/sirloinbh/money'
