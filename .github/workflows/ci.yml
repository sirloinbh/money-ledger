# Managed file. Edit it in sirloinbh/project-standards templates/app/.github/workflows/
# Calls the central shared CI (reusable-app-ci) pinned to the central commit that was synced. Values come from the central registry and versions.json.
name: ci

# One run per commit: a pull request is tested through pull_request only; push runs on main (#699).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # write is the most the image-push job of the reusable workflow may use; every other job gets read (ADR-0023, #754).
  packages: write

jobs:
  ci:
    uses: sirloinbh/project-standards/.github/workflows/reusable-app-ci.yml@2c416d46ba70bcde9aa03dd00a32f25a6a60f68a
    with:
      node-version: '24.21.0'
      npm-version: '11.19.0'
      postgres-image: 'postgres:17-alpine'
      db-name: 'money_test'
      e2e: true
      e2e-visual: false
      playwright-image: 'mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27'
      knip-strict: true
      push-images: false
      image-prefix: 'ghcr.io/sirloinbh/money'
